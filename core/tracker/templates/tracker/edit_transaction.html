{% extends "base.html" %}
{% block title %}Edit Transaction – Expense Tracker{% endblock %}
{% block nav_links %}
  <a href="{% url 'tracker:dashboard' %}">Dashboard</a>
  <a href="{% url 'tracker:list_transactions' %}">Transactions</a>
  <a href="{% url 'tracker:list_categories' %}">Categories</a>
  <a href="{% url 'tracker:list_accounts' %}">Accounts</a>
  <a href="{% url 'tracker:list_budgets' %}">Budgets</a>
  <a href="{% url 'tracker:settings' %}">Settings</a>
  <a href="{% url 'tracker:logout' %}">Logout</a>
{% endblock %}
{% block content %}
  <h1>Edit Transaction</h1>
  <form method="post" action="{% url 'tracker:edit_transaction' transaction.id %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="amount">Amount *</label>
      <input type="number" id="amount" name="amount" step="0.01" min="0" value="{{ transaction.amount }}" required>
    </div>
    <div class="form-group">
      <label for="type">Type</label>
      <select id="type" name="type">
        <option value="expense" {% if transaction.type == 'expense' %}selected{% endif %}>Expense</option>
        <option value="income" {% if transaction.type == 'income' %}selected{% endif %}>Income</option>
      </select>
    </div>
    <div class="form-group">
      <label for="category">Category</label>
      <select id="category" name="category">
        <option value="Food" {% if transaction.category == 'Food' %}selected{% endif %}>Food</option>
        <option value="Transport" {% if transaction.category == 'Transport' %}selected{% endif %}>Transport</option>
        <option value="Shopping" {% if transaction.category == 'Shopping' %}selected{% endif %}>Shopping</option>
        <option value="Bills" {% if transaction.category == 'Bills' %}selected{% endif %}>Bills</option>
        <option value="Health" {% if transaction.category == 'Health' %}selected{% endif %}>Health</option>
        <option value="Entertainment" {% if transaction.category == 'Entertainment' %}selected{% endif %}>Entertainment</option>
        <option value="Salary" {% if transaction.category == 'Salary' %}selected{% endif %}>Salary</option>
        <option value="Other" {% if transaction.category == 'Other' or not transaction.category %}selected{% endif %}>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label for="date">Date *</label>
      <input type="date" id="date" name="date" value="{{ transaction.date|default:'' }}" required>
    </div>
    <div class="form-group">
      <label for="note">Note</label>
      <input type="text" id="note" name="note" value="{{ transaction.note|default:'' }}" placeholder="Optional">
    </div>
    <div class="form-group">
      <label for="payment_method">Payment Method</label>
      <select id="payment_method" name="payment_method">
        <option value="Cash" {% if transaction.payment_method == 'Cash' %}selected{% endif %}>Cash</option>
        <option value="Card" {% if transaction.payment_method == 'Card' %}selected{% endif %}>Card</option>
        <option value="UPI" {% if transaction.payment_method == 'UPI' %}selected{% endif %}>UPI</option>
        <option value="Bank Transfer" {% if transaction.payment_method == 'Bank Transfer' %}selected{% endif %}>Bank Transfer</option>
      </select>
    </div>
    <div class="form-group">
      <label for="account">Account</label>
      <select id="account" name="account">
        {% for acc in accounts %}
          <option value="{{ acc.name }}" {% if transaction.account == acc.name %}selected{% endif %}>{{ acc.icon|default:"" }} {{ acc.name }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit">Update</button>
    <a href="{% url 'tracker:list_transactions' %}">Cancel</a>
  </form>
{% endblock %}
